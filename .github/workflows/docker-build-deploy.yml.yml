name: Build and Deploy Tournament Defender Docker Image

on:
  push:
    branches:
      - DetectionJess  # Change this to your tournament branch name
    paths:
      - 'defender/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract branch name
      shell: bash
      run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      id: extract_branch

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./defender
        file: ./defender/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/malarena-defender:tournament
          ${{ secrets.DOCKERHUB_USERNAME }}/malarena-defender:tournament-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Summary
      run: |
        echo "✅ Tournament image pushed to Docker Hub"
        echo "📦 Image tags:"
        echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/malarena-defender:tournament"
        echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/malarena-defender:tournament-${{ github.sha }}"