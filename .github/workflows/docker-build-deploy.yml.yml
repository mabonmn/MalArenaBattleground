name: Build and Deploy Defender Docker Image

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - 'defender/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Get current date
      id: date
      run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./defender
        file: ./defender/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/malarena-defender:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/malarena-defender:${{ github.sha }}
          ${{ secrets.DOCKERHUB_USERNAME }}/malarena-defender:${{ env.DATE }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
